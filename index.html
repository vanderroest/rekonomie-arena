<html lang="nl">
<head>

<title>Rekonomie Arena · Kennemer Lyceum</title>

<style>
/* ===== Rekonomie Arena – Kennemer Lyceum =====
   Pas hier de schoolkleuren aan. */
:root {
  --kl-blauw: #12355b;      /* hoofdkleur */
  --kl-blauw-2: #1d4f86;
  --kl-accent: #f4a300;     /* accent (knoppen, XP) */
  --kl-groen: #2f8f5b;      /* duinen & bos van Overveen */
  --kl-zand: #f6efe2;
  --bg: #f3f5f9;
  --kaart: #ffffff;
  --tekst: #1b2433;
  --zacht: #5d6b80;
  --rand: #dde3ec;
  --goed: #2f8f5b;
  --fout: #c8412d;
  --bijna: #d98a00;
  --radius: 14px;
  --schaduw: 0 2px 10px rgba(18, 53, 91, .08);
  font-size: 17px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg); color: var(--tekst); line-height: 1.45;
  min-height: 100vh; min-height: 100dvh; touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
h1, h2, h3 { line-height: 1.2; margin: 0 0 .5em; }
h2 { font-size: 1.35rem; } h3 { font-size: 1.08rem; margin-top: 1.1em; }
.verborgen { display: none !important; }

/* --- kopbalk --- */
.kop {
  background: var(--kl-blauw); color: #fff; padding: 10px 16px;
  padding-top: max(10px, env(safe-area-inset-top));
  display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 20;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.kop .logo { height: 34px; width: auto; background: #fff; border-radius: 6px; padding: 3px 6px; }
.kop .woordmerk { font-weight: 700; letter-spacing: .02em; font-size: .95rem; line-height: 1.1; }
.kop .woordmerk small { display: block; font-weight: 400; opacity: .8; font-size: .75rem; }
.kop .ruimte { flex: 1; }
.kop .knop-kop { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 10px; padding: 8px 12px; min-height: 40px; font-size: .9rem; }
.kop .knop-kop:active { background: rgba(255,255,255,.25); }
.xpblok { display: flex; flex-direction: column; min-width: 150px; gap: 3px; }
.xpblok .titel { font-size: .8rem; opacity: .9; }
.xpbalk { height: 9px; background: rgba(255,255,255,.2); border-radius: 9px; overflow: hidden; }
.xpbalk > div { height: 100%; background: var(--kl-accent); border-radius: 9px; transition: width .5s; }
.opslag { font-size: .75rem; opacity: .85; }

.wrap { max-width: 980px; margin: 0 auto; padding: 16px; padding-bottom: max(32px, env(safe-area-inset-bottom)); }
.kaart { background: var(--kaart); border-radius: var(--radius); box-shadow: var(--schaduw); padding: 18px; margin-bottom: 16px; border: 1px solid var(--rand); }

/* --- knoppen --- */
.knop {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: none; border-radius: 12px; padding: 12px 20px; min-height: 48px; font-weight: 600;
  background: var(--kl-blauw); color: #fff; transition: transform .08s, filter .15s;
}
.knop:active { transform: scale(.97); }
.knop:disabled { opacity: .45; }
.knop.accent { background: var(--kl-accent); color: #1b1b1b; }
.knop.groen { background: var(--goed); }
.knop.licht { background: #e9eef6; color: var(--kl-blauw); }
.knop.rand { background: #fff; color: var(--kl-blauw); border: 2px solid var(--kl-blauw); }
.knop.klein { min-height: 38px; padding: 7px 12px; font-size: .9rem; border-radius: 10px; }
.knop.vol { width: 100%; }
.knoprij { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* --- login --- */
.login-scherm { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px;
  background: linear-gradient(160deg, var(--kl-blauw) 0%, var(--kl-blauw-2) 55%, var(--kl-groen) 130%); }
.login-kaart { background: #fff; border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 430px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.login-kaart .logo-groot { display: block; height: 58px; margin: 0 auto 10px; max-width: 100%; }
.login-kaart h1 { text-align: center; color: var(--kl-blauw); font-size: 1.7rem; margin-bottom: 2px; }
.login-kaart .ondertitel { text-align: center; color: var(--zacht); margin: 0 0 18px; font-size: .95rem; }
.slogan { text-align: center; color: var(--kl-groen); font-weight: 600; font-style: italic; font-size: .9rem; margin-top: 14px; }
label.veld { display: block; margin-bottom: 12px; font-weight: 600; font-size: .92rem; }
label.veld input, label.veld select { display: block; width: 100%; margin-top: 5px; padding: 12px 14px; border: 2px solid var(--rand); border-radius: 12px; font-size: 17px; background: #fff; font-weight: 400; }
label.veld input:focus, .antwoord-invoer:focus, textarea:focus { outline: none; border-color: var(--kl-blauw-2); box-shadow: 0 0 0 3px rgba(29,79,134,.15); }
.melding { padding: 10px 14px; border-radius: 10px; margin: 10px 0; font-size: .93rem; }
.melding.fout { background: #fdecea; color: #8a2414; }
.melding.info { background: #e8f0fb; color: var(--kl-blauw); }
.melding.goed { background: #e7f5ec; color: #1d5e3b; }
.link { background: none; border: none; color: var(--kl-blauw-2); text-decoration: underline; padding: 8px; font-size: .9rem; }

/* --- kaart met paragrafen --- */
.wereld { margin-bottom: 22px; }
.wereld-kop { display: flex; align-items: baseline; gap: 10px; margin: 6px 4px 10px; }
.wereld-kop h2 { margin: 0; color: var(--kl-blauw); }
.wereld-kop span { color: var(--zacht); font-size: .9rem; }
.pad { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.level {
  position: relative; background: #fff; border: 2px solid var(--rand); border-radius: 16px; padding: 16px; text-align: left;
  min-height: 150px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--schaduw); color: var(--tekst);
}
.level .nr { font-size: .8rem; font-weight: 700; color: var(--kl-blauw-2); letter-spacing: .05em; }
.level .naam { font-weight: 700; font-size: 1.05rem; }
.level .voortgang { height: 8px; background: #eef1f6; border-radius: 8px; overflow: hidden; margin-top: auto; }
.level .voortgang > div { height: 100%; background: var(--kl-groen); }
.level .sub { font-size: .82rem; color: var(--zacht); display: flex; justify-content: space-between; }
.level.boss { border-color: var(--kl-accent); background: linear-gradient(180deg, #fff 60%, #fff6e0); }
.level.boss .nr::after { content: " · EINDBAAS"; color: #b06f00; }
.level.op-slot { opacity: .75; background: #f2f4f7; }
.level.op-slot .naam::before { content: "🔒 "; }
.sterren { font-size: 1.1rem; letter-spacing: 2px; color: #d0d6e0; }
.sterren .aan { color: var(--kl-accent); }

/* --- paragraaf --- */
.terugrij { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.terugrij h2 { margin: 0; flex: 1; min-width: 200px; }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; background: #e6ebf2; padding: 5px; border-radius: 14px; }
.tabs button { flex: 1; border: none; background: none; padding: 10px 8px; border-radius: 10px; font-weight: 600; color: var(--zacht); min-height: 44px; }
.tabs button.actief { background: #fff; color: var(--kl-blauw); box-shadow: var(--schaduw); }
.theorie p, .theorie li { max-width: 70ch; }
.theorie .vb { background: var(--kl-zand); border-left: 4px solid var(--kl-accent); padding: 10px 14px; border-radius: 8px; margin: 10px 0; }
.theorie .formule, .formule { background: #eaf1fa; padding: 8px 14px; border-radius: 8px; font-weight: 600; display: inline-block; color: var(--kl-blauw); }
.theorie .let { background: #fdecea; padding: 8px 12px; border-radius: 8px; }
.theorie .tip { color: var(--kl-groen); font-weight: 600; }
table.tt { border-collapse: collapse; margin: 8px 0; font-size: .95rem; }
table.tt td, table.tt th { border: 1px solid var(--rand); padding: 5px 10px; text-align: left; }
table.tt th { background: #f0f3f8; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chipgroep { display: flex; gap: 4px; align-items: center; background: #fff; border: 1px solid var(--rand); border-radius: 12px; padding: 4px 6px; }
.chipgroep b { font-size: .78rem; color: var(--zacht); padding: 0 4px; }
.chip { border: 2px solid var(--rand); background: #fff; border-radius: 9px; min-width: 40px; min-height: 38px; padding: 4px 8px; font-size: .85rem; font-weight: 600; color: var(--zacht); }
.chip.klaar { background: #e7f5ec; border-color: #9fd3b4; color: var(--goed); }
.chip.getoond { background: #fff4dc; border-color: #f1c66b; color: #8a5a00; }
.chip.actief { border-color: var(--kl-blauw); color: var(--kl-blauw); box-shadow: 0 0 0 2px rgba(18,53,91,.15); }

.context { background: var(--kl-zand); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: .97rem; }
.context .bron { font-size: .78rem; color: var(--zacht); display: block; margin-bottom: 3px; }
.vraagtekst { font-size: 1.08rem; font-weight: 600; margin-bottom: 12px; }
.vraaglabel { font-size: .8rem; font-weight: 700; color: var(--kl-blauw-2); letter-spacing: .04em; margin-bottom: 4px; }
.invoerrij { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; margin-bottom: 10px; }
.antwoord-invoer { flex: 1 1 200px; min-width: 0; padding: 12px 14px; font-size: 20px; border: 2px solid var(--rand); border-radius: 12px; min-height: 52px; background: #fff; }
.invoer-wrap { flex: 1 1 220px; display: flex; gap: 6px; align-items: stretch; }
.teken { min-width: 52px; border: 2px solid var(--rand); background: #f4f6fa; border-radius: 12px; font-size: 1.2rem; font-weight: 700; color: var(--zacht); }
.eenheid-vast { align-self: center; color: var(--zacht); font-weight: 600; }
.eenheden { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.eenheden span { font-size: .82rem; color: var(--zacht); margin-right: 2px; }
.eenheid { border: 2px solid var(--rand); background: #fff; border-radius: 10px; min-height: 48px; min-width: 52px; padding: 6px 12px; font-weight: 700; color: var(--zacht); }
.eenheid.gekozen { border-color: var(--kl-blauw); background: var(--kl-blauw); color: #fff; }
.opties { display: grid; gap: 8px; margin-bottom: 12px; }
.optie { text-align: left; border: 2px solid var(--rand); background: #fff; border-radius: 12px; padding: 12px 14px; min-height: 50px; font-weight: 500; }
.optie.gekozen { border-color: var(--kl-blauw); background: #eef3fa; }
.optie.fout { border-color: var(--fout); background: #fdecea; opacity: .7; }
.optie.goed { border-color: var(--goed); background: #e7f5ec; }
textarea.open { width: 100%; min-height: 110px; border: 2px solid var(--rand); border-radius: 12px; padding: 12px; font-size: 17px; }
.feedback { border-radius: 12px; padding: 12px 14px; margin: 10px 0; font-size: .97rem; animation: verschijn .25s ease; }
.feedback.goed { background: #e7f5ec; color: #1d5e3b; border: 1px solid #a9d9bc; }
.feedback.fout { background: #fdecea; color: #8a2414; border: 1px solid #f2b8ad; }
.feedback.bijna { background: #fff4dc; color: #7a4f00; border: 1px solid #f1c66b; }
.feedback.info { background: #e8f0fb; color: var(--kl-blauw); border: 1px solid #c3d5ef; }
.feedback .uitleg { margin-top: 6px; color: var(--tekst); }
.hintblok { background: #f4effd; border: 1px solid #d7c9f5; color: #4a2f86; border-radius: 12px; padding: 10px 14px; margin: 8px 0; }
@keyframes verschijn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.schud { animation: schud .35s; }
@keyframes schud { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }

.trainkop { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.reeks { font-weight: 700; color: #b06f00; }
.vlammen { font-size: 1.3rem; }

/* --- toasts & modals --- */
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom)); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: 92%; max-width: 420px; }
.toast { background: var(--kl-blauw); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); animation: toast 2.8s forwards; text-align: center; }
.toast.xp { background: var(--kl-accent); color: #1b1b1b; }
.toast.badge { background: var(--kl-groen); }
@keyframes toast { 0% { opacity: 0; transform: translateY(12px); } 10%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }
.modal-achter { position: fixed; inset: 0; background: rgba(10,25,45,.55); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; animation: verschijn .2s; }
.modal { background: #fff; border-radius: 18px; width: 100%; max-width: 560px; max-height: 88vh; max-height: 88dvh; overflow: auto; padding: 20px; -webkit-overflow-scrolling: touch; }
.modal .sluit { float: right; }
.ranglijst { list-style: none; padding: 0; margin: 0; }
.ranglijst li { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; margin-bottom: 6px; background: #f5f7fb; }
.ranglijst li.ik { background: #fff4dc; border: 2px solid var(--kl-accent); }
.ranglijst .pos { font-weight: 800; width: 30px; color: var(--kl-blauw); }
.ranglijst .nm { flex: 1; }
.ranglijst .sc { font-weight: 700; }
.ranglijst.top10 { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(5, auto); column-gap: 10px; margin-top: 10px; }
.ranglijst.top10 li { margin-bottom: 6px; padding: 7px 10px; }
@media (max-width: 640px) { .ranglijst.top10 { grid-template-columns: 1fr; grid-auto-flow: row; grid-template-rows: none; } }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.badge { border: 2px solid var(--rand); border-radius: 14px; padding: 12px; text-align: center; background: #fafbfd; }
.badge .ic { font-size: 2rem; filter: grayscale(1); opacity: .35; }
.badge.behaald { border-color: var(--kl-accent); background: #fffaf0; }
.badge.behaald .ic { filter: none; opacity: 1; }
.badge .bn { font-weight: 700; font-size: .9rem; }
.badge .bo { font-size: .78rem; color: var(--zacht); }

/* --- strijd (leerling) --- */
.strijd-scherm { min-height: 100vh; min-height: 100dvh; background: linear-gradient(170deg, var(--kl-blauw), #0c2442); color: #fff; padding: 20px; padding-top: max(20px, env(safe-area-inset-top)); }
.strijd-scherm .kaart { color: var(--tekst); }
.strijd-kop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
.timer { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.timerbalk { height: 10px; background: rgba(255,255,255,.2); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
.timerbalk > div { height: 100%; background: var(--kl-accent); transition: width 1s linear; }
.groot { font-size: 1.4rem; font-weight: 700; }
.teamknoppen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.teamknop { border: none; border-radius: 14px; min-height: 80px; font-size: 1.15rem; font-weight: 800; color: #fff; }
.team-1 { background: #d9a400; } .team-2 { background: #2f8f5b; } .team-3 { background: #1f6fb5; } .team-4 { background: #d0662a; }
.teamlabel { display: inline-block; padding: 2px 10px; border-radius: 20px; color: #fff; font-weight: 700; font-size: .85rem; }

/* --- docent / digibord --- */
.docent-tabel { width: 100%; border-collapse: collapse; font-size: .9rem; }
.docent-tabel th, .docent-tabel td { padding: 8px 6px; border-bottom: 1px solid var(--rand); text-align: left; vertical-align: middle; }
.docent-tabel th { font-size: .78rem; color: var(--zacht); text-transform: uppercase; letter-spacing: .03em; position: sticky; top: 0; background: #fff; }
.tabelwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.mini { display: inline-block; min-width: 54px; }
.mini .balk { height: 6px; background: #eef1f6; border-radius: 6px; overflow: hidden; }
.mini .balk > div { height: 100%; background: var(--kl-groen); }
.mini small { font-size: .72rem; color: var(--zacht); }
.staaf { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.staaf .lbl { width: 170px; font-size: .9rem; }
.staaf .bk { flex: 1; height: 16px; background: #eef1f6; border-radius: 8px; overflow: hidden; }
.staaf .bk > div { height: 100%; background: var(--fout); opacity: .8; }
.staaf .n { width: 40px; text-align: right; font-weight: 700; }
.bord { min-height: 100vh; min-height: 100dvh; background: linear-gradient(170deg, var(--kl-blauw), #0c2442); color: #fff; padding: 24px; }
.bord .kaart { color: var(--tekst); }
.bord h1 { font-size: 2.2rem; }
.spelcode { font-size: 5rem; font-weight: 900; letter-spacing: .15em; color: var(--kl-accent); line-height: 1; }
.bord-vraag { font-size: 1.9rem; font-weight: 700; line-height: 1.3; }
.bord-context { font-size: 1.15rem; opacity: .92; margin-bottom: 10px; }
.spelers { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.speler { background: rgba(255,255,255,.14); padding: 6px 12px; border-radius: 20px; font-weight: 600; }
.podium li { font-size: 1.2rem; }
.vs { display: flex; gap: 16px; align-items: stretch; }
.vs > div { flex: 1; text-align: center; background: rgba(255,255,255,.12); border-radius: 16px; padding: 16px; }
.vs .sc { font-size: 2.6rem; font-weight: 900; color: var(--kl-accent); }
.check-lijst label { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 1rem; }
.check-lijst input { width: 22px; height: 22px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }

@media (max-width: 640px) {
  :root { font-size: 16px; }
  .kop .woordmerk { display: none; }
  .xpblok { min-width: 110px; }
  .bord-vraag { font-size: 1.4rem; }
  .spelcode { font-size: 3.6rem; }
  .staaf .lbl { width: 120px; }
}
@media print { .kop, #toasts { display: none; } }

</style>

<div id="app"></div>

<noscript>Zet JavaScript aan om Rekonomie Arena te gebruiken.</noscript>
<script>
/* Rekonomie Arena – lesstof H1 en H2 (Rekonomie VWO, LWEO 4e druk)
   Theorie en opdrachtteksten zijn in eigen woorden samengevat; de leerling heeft het boekje als naslag.
   Vraagtypen: num (getal), mc (meerkeuze), open (zelf nakijken met modelantwoord). */
(function (global) {
'use strict';

/* ---------- hulpfuncties ---------- */
const r = (x, d) => { const f = Math.pow(10, d); return Math.round((x + Math.sign(x) * 1e-9) * f) / f; };
const fmt = (x, d) => Number(x).toLocaleString('nl-NL', { minimumFractionDigits: d, maximumFractionDigits: d });
const eur = (x, d = 2) => '€ ' + fmt(x, d);
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const pct = (deel, geheel) => deel / geheel * 100;
const sf = x => Number(x).toLocaleString('nl-NL', { maximumFractionDigits: 4 });

/* ---------- THEORIE ---------- */
const T = {};
T['1.1'] = `
<h3>Afronden: de regel</h3>
<p>Je kijkt naar het eerste cijfer <b>ná</b> de plek waarop je afrondt.</p>
<ul><li>0, 1, 2, 3 of 4 → naar beneden afronden</li><li>5, 6, 7, 8 of 9 → naar boven afronden</li></ul>
<div class="vb"><b>Voorbeeld.</b> 7,3649 op twee decimalen: kijk naar het derde cijfer achter de komma (4) → <b>7,36</b>.<br>
Op één decimaal: kijk naar het tweede cijfer (6) → <b>7,4</b>.<br>
3.482 op honderdtallen: kijk naar het tiental (8) → <b>3.500</b>.</div>
<h3>Afspraken bij economie</h3>
<ul>
<li>Staat er niet bij hoe je moet afronden? Dan rond je af op <b>één decimaal</b>.</li>
<li>Geldbedragen rond je altijd af op <b>twee decimalen</b> (centen), ook als de laatste een nul is: € 3,40 en niet € 3,4.</li>
<li><b>Niet tussentijds afronden.</b> Reken door met het volledige getal op je rekenmachine en rond pas het eindantwoord af.</li>
<li>Rond ook niet <b>twee keer</b> af. 6,45 op een heel getal is 6 (je kijkt naar de 4). Wie eerst 6,5 maakt en daarna 7, rondt twee keer af.</li>
</ul>
<div class="vb"><b>Waarom niet tussendoor afronden?</b> (17,3 / 6) × 9.000 = 2,88333… × 9.000 = 25.950.<br>
Rond je tussendoor af op 2,9, dan krijg je 26.100: dat is € 150 te veel.</div>
<h3>Laat zien wat je doet</h3>
<p>Schrijf altijd je berekening op en zet de <b>eenheid</b> bij je antwoord: €, $, %, stuks, jaren, per persoon… In deze app kies je daarom ook de eenheid.</p>`;

T['1.2'] = `
<h3>Hoeveel nullen?</h3>
<table class="tt"><tr><th>woord</th><th>nullen</th><th>voluit</th></tr>

<div class="vb"><b>Voorbeeld.</b> € 3,75 miljard = € 3.750.000.000 (de komma schuift negen plaatsen op).</div>
<h3>Rekenen zonder alle nullen in te toetsen</h3>
<p>Tel de nullen apart en reken alleen met de "kale" getallen.</p>
<ul>
<li>biljoen ÷ miljoen = miljoen &nbsp;·&nbsp; biljoen ÷ miljard = duizend</li>
<li>miljard ÷ miljoen = duizend &nbsp;·&nbsp; miljard ÷ duizend = miljoen &nbsp;·&nbsp; miljoen ÷ duizend = duizend</li>
<li>duizend × miljard = biljoen &nbsp;·&nbsp; duizend × miljoen = miljard &nbsp;·&nbsp; duizend × duizend = miljoen</li>
</ul>
<div class="vb"><b>Delen.</b> € 24 miljard ÷ 8 miljoen inwoners = (24 ÷ 8) × duizend = <b>€ 3.000</b> per inwoner.<br>
<b>Vermenigvuldigen.</b> € 30 miljoen × 4.000 = 120.000 miljoen = <b>€ 120 miljard</b>.</div>
<h3>Rekenmachine</h3>

T['2.1'] = `
<h3>Van getal naar percentage</h3>
<p>Een percentage zegt hoe groot een <b>deel</b> is ten opzichte van een <b>geheel</b>. Het geheel is de <b>basis</b> en stel je op 100%.</p>
<p class="formule">percentage = (deel ÷ geheel) × 100%</p>
<div class="vb"><b>Voorbeeld.</b> Sanne verdient € 520 per maand en geeft € 130 uit aan haar telefoon en kleding.<br>
(130 ÷ 520) × 100% = <b>25%</b> van haar inkomen.</div>
<p>Of met een verhoudingstabel:</p>
<table class="tt"><tr><th></th><th>deel</th><th>geheel</th></tr><tr><td>getal</td><td>130</td><td>520</td></tr><tr><td>procent</td><td>?</td><td>100</td></tr></table>
<p>Kruislings: ? = 130 × 100 ÷ 520 = 25.</p>
<h3>Van percentage naar getal</h3>
<p class="formule">deel = (percentage ÷ 100) × geheel</p>
<div class="vb">35% van € 2.400 = 0,35 × 2.400 = <b>€ 840</b>.</div>
<h3>Btw</h3>
<p>Btw komt <b>bovenop</b> de prijs exclusief btw. Tarieven: <b>9%</b> (eerste levensbehoeften, zoals voedsel) en <b>21%</b> (overige producten).</p>
<table class="tt"><tr><td>prijs exclusief btw</td><td>100%</td></tr><tr><td>btw</td><td>21%</td></tr><tr><td>prijs inclusief btw</td><td>121%</td></tr></table>
<div class="vb"><b>Voorbeeld.</b> Een koptelefoon kost € 72,60 inclusief 21% btw.<br>
1% = 72,60 ÷ 121 = 0,60 → btw = 21 × 0,60 = <b>€ 12,60</b>; exclusief btw = 100 × 0,60 = <b>€ 60,00</b>.</div>
<p class="let">Let op: de btw is <b>niet</b> 21% van de prijs inclusief btw! De basis (100%) is de prijs exclusief btw.</p>
<h3>Altijd eerst: wat is de basis?</h3>
<p>Vraag je bij elke procentsom af welk bedrag 100% is. Na 30% aflossen is de restschuld 70% van de oorspronkelijke lening, dus lening = restschuld ÷ 70 × 100.</p>`;

T['2.2'] = `
<h3>Groeifactor</h3>
<p>Bij een stijging of daling met een percentage vermenigvuldig je met de <b>groeifactor</b>.</p>
<p class="formule">groeifactor = (100 + stijging) ÷ 100 &nbsp;of&nbsp; (100 − daling) ÷ 100</p>
<table class="tt"><tr><th>verandering</th><th>groeifactor</th></tr>
<tr><td>+4%</td><td>1,04</td></tr><tr><td>+0,5%</td><td>1,005</td></tr><tr><td>+120%</td><td>2,20</td></tr><tr><td>−15%</td><td>0,85</td></tr><tr><td>−99%</td><td>0,01</td></tr></table>
<p class="formule">nieuw = oud × groeifactor</p>
<div class="vb"><b>Voorbeeld.</b> € 800 sparen tegen 3% rente: na 1 jaar 800 × 1,03 = € 824,00; na 4 jaar 800 × 1,03<sup>4</sup> = <b>€ 900,41</b>.</div>
<h3>Procentuele verandering</h3>
<p class="formule">procentuele verandering = (nieuw − oud) ÷ oud × 100%</p>
<div class="vb">Omzet van € 2,5 miljoen naar € 2,8 miljoen: (2,8 − 2,5) ÷ 2,5 × 100% = <b>+12%</b>.<br>Een negatieve uitkomst is een daling.</div>
<h3>"Hoeveel procent meer/minder dan…"</h3>
<p>Het getal ná <b>"dan"</b> is de basis (oud).</p>
<div class="vb">Lisa verdient € 50, Tim € 40.<br>Lisa verdient (50 − 40) ÷ <b>40</b> × 100% = <b>25% meer</b> dan Tim.<br>Tim verdient (40 − 50) ÷ <b>50</b> × 100% = −20%, dus <b>20% minder</b> dan Lisa.</div>
<h3>Terugrekenen</h3>
<p>Is de nieuwe waarde bekend en de procentuele verandering ook? Dan deel je door de groeifactor:</p>
<p class="formule">oud = nieuw ÷ groeifactor</p>
<div class="vb">Na een stijging van 8% is de omzet € 432.000. Vorig jaar: 432.000 ÷ 1,08 = <b>€ 400.000</b>.<br>
Fout is: 432.000 × 0,92 (dan neem je de verkeerde basis).</div>`;

T['2.3'] = `
<h3>Procent of procentpunt?</h3>
<p>Als een <b>percentage</b> verandert, kun je die verandering op twee manieren uitdrukken:</p>
<ul><li><b>Procentpunten</b>: gewoon het verschil tussen de twee percentages (nieuw − oud).</li>
<li><b>Procenten</b>: de procentuele verandering met de formule (nieuw − oud) ÷ oud × 100%.</li></ul>
<div class="vb"><b>Voorbeeld.</b> De werkloosheid stijgt van 4% naar 5%.<br>
Dat is een stijging van <b>1 procentpunt</b>,<br>maar ook van (5 − 4) ÷ 4 × 100% = <b>25%</b>.</div>
<p class="let">Een veelgemaakte fout (ook in kranten): "daalde met 1,3%" schrijven als een percentage van 26% naar 24,7% gaat. Dat is een daling van 1,3 procent<b>punt</b>, maar 5% in procenten.</p>`;

T['2.4'] = `
<h3>Zelftest hoofdstuk 2 – eindbaas</h3>
<ul><li>Bepaal eerst de <b>basis</b> (100%).</li>
<li>Deel ÷ geheel × 100% · nieuw = oud × groeifactor · oud = nieuw ÷ groeifactor.</li>
<li>(nieuw − oud) ÷ oud × 100%; bij "meer/minder dan X" is X de basis.</li>
<li>Btw: exclusief = 100%, inclusief = 109% of 121%.</li>
<li>Korting van 20%: je betaalt 80% van de oude prijs.</li>
<li>Verschil tussen twee percentages → procentpunten.</li>
<li>Prijzen van verschillende hoeveelheden vergelijken? Reken eerst om naar een prijs per eenheid (per gram, per stuk).</li></ul>`;

<script>
/* Rekonomie Arena – nakijkmotor (invoer lezen, controleren, antwoord tonen) */
(function (global) {
'use strict';
const { r, fmt } = global.RK.util;
const WOORDEN = [['biljoen', 1e12], ['miljard', 1e9], ['miljoen', 1e6], ['duizend', 1e3]];
const SCALEWOORD = { 1e3: 'duizend', 1e6: 'miljoen', 1e9: 'miljard', 1e12: 'biljoen' };
const KEUZE_EENHEDEN = ['€', '$', '%', 'procentpunt'];

/* Lees een getal zoals een leerling het typt: "1.234,56", "1234.56", "-2,9", "588,7 miljard", "€ 17,00", "12 %".
   Geeft [hoofdinterpretatie, alternatieve interpretatie] terug (punt als decimaalteken). */
function parseNum(input) {
  if (input == null) return [NaN, NaN];
  let s = String(input).toLowerCase().trim()
    .replace(/[−–—]/g, '-')          // allerlei mintekens
    .replace(/€|\$|euro'?s?|dollars?|procentpunten|procentpunt|pp|%|procent/g, '')
    .replace(/ /g, ' ').trim();
  let mult = 1;
  for (const [w, m] of WOORDEN) { const i = s.indexOf(w); if (i > 0) { mult = m; s = s.slice(0, i); break; } }
  s = s.replace(/[a-z\u00c0-\u024f]+\.?/g, ' ').trim();       // overige woorden (jaar, stuks, liter…) weglaten
  s = s.replace(/\s+/g, '').replace(/'/g, '');
  if (s === '' || s === '-') return [NaN, NaN];
  let main, alt = NaN;
  if (s.includes(',')) {
    const t = s.replace(/\./g, '').replace(',', '.');
    if (!/^-?\d*\.?\d+$/.test(t)) return [NaN, NaN];
    main = parseFloat(t);
  } else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) {
    main = parseFloat(s.replace(/\./g, ''));
    if (/^-?\d{1,3}\.\d{3}$/.test(s)) alt = parseFloat(s); // 1.005 kan ook 1,005 bedoeld zijn
  } else {
    if (!/^-?\d*\.?\d+$/.test(s)) return [NaN, NaN];
    main = parseFloat(s);
  }
  return [main * mult, isNaN(alt) ? NaN : alt * mult];
}

const half = d => 0.5 * Math.pow(10, -d) * (1 + 1e-9) + 1e-12;

function check(q, input, unitChosen) {
  if (q.type === 'mc') {
    if (input === null || input === undefined || input === '') return { status: 'leeg', tekst: 'Kies een antwoord.' };

    return { status: 'goed', waarde: vx };

  const d = q.scale ? (q.ds ?? 1) : (q.d ?? 1);

    const tgt = r(q.antwoord, d);
    if (Math.abs(xa - tgt) <= Math.pow(10, -d) * 1.0001) return { status: 'fout', tekst: 'Net niet. Kijk naar welk cijfer je moet kijken en welke kant je op moet afronden.', soort: 'afronden' };
  } else if (refs.some(ref => Math.abs(xa - ref) <= Math.abs(ref) * 0.01)) {
    return { status: 'bijna', tekst: `Bijna! Controleer je afronding: ${d === 0 ? 'rond af op een heel getal' : 'rond af op ' + d + (d === 1 ? ' decimaal' : ' decimalen')}${q.unit === '€' && d === 2 ? ' (geldbedrag: in centen)' : ''}, en rond niet tussentijds af.`, soort: 'afronden' };
  }
  const full = refs[refs.length - 1];
  if (Math.abs(full) > 0 && xa !== 0) {
    const ratio = Math.abs(xa / full);
    for (const k of [1e3, 1e6, 1e9]) {
      if (Math.abs(ratio / k - 1) < 0.01 || Math.abs(ratio * k - 1) < 0.01) return { status: 'fout', tekst: 'Je zit er een factor ' + fmt(k, 0) + ' naast. Tel de nullen goed (duizend, miljoen, miljard).', soort: 'nullen' };
    }
    if (!q.scale && (Math.abs(ratio / 100 - 1) < 0.01 || Math.abs(ratio * 100 - 1) < 0.01)) return { status: 'fout', tekst: 'Je zit er een factor 100 naast. Denk aan × 100% (of deel een percentage door 100).', soort: 'formule' };
  }

}

/* Juiste antwoord als tekst */
function antwoordTekst(q) {
  if (q.type === 'mc') return q.opties[q.juist];
  if (q.type === 'open') return q.model;

const RANGEN = [[0, 'Rekenrekruut'], [80, 'Kommakenner'], [200, 'Getallentemmer'], [400, 'Procentprof'], [650, 'Basisbaas'], [1000, 'Rekonomie-legende']];

async function autoLogin() {

/* ---------- controleren ---------- */
function controleer() {
  const c = ui.cur; const q = c.q; const inv = $('#ant') ? $('#ant').value : ''; c.inv = inv;
  const res = E.check(q, inv, c.unit);
  if (c.mode === 'check') return checkAntwoord(res);
  const rec = c.mode === 'boek' ? (st.q[q.id] = st.q[q.id] || { a: 0 }) : null;
  if (res.status === 'leeg' || res.status === 'kies-eenheid') { c.fb = fbHTML('info', '', res.tekst); return herteken(); }
  if (res.status === 'bijna') { c.fb = fbHTML('bijna', 'Bijna.', res.tekst); if (res.soort) st.fs[res.soort] = (st.fs[res.soort] || 0) + 1; bewaar(); return herteken(); }

    if (c.mode === 'train') { const tr = trRec(ui.par.id); tr.f++; tr.st = 0; }

    return;

}
function goedAfhandelen(c, rec) {
  const q = c.q;

    let xp = rec.a === 0 ? 10 : rec.a === 1 ? 6 : 3; if (c.hint) xp = Math.ceil(xp / 2);
    if (q.schatting) xp = 5; // schatvraag

    telGoed(q, eerste, ui.par.id); geefXP(xp, eerste ? 'in één keer goed' : '');
    const was = parStatus(ui.par);
    c.fb = '';
    checkBadges(); bewaar(); herteken();
    if (was.done === was.totaal) setTimeout(() => toast(`⭐ Paragraaf ${ui.par.id} voltooid!`, 'badge'), 400);

    <div class="kaart"><h3 style="margin-top:0">Meest gemaakte foutsoorten</h3>${Object.keys(fs).length ? Object.entries(fs).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="staaf"><span class="lbl">${FSN[k] || k}</span><span class="bk"><div style="width:${100 * v / maxfs}%"></div></span><span class="n">${v}</span></div>`).join('') : '<p>Nog geen fouten geregistreerd.</p>'}</div>
  </div>
  <div class="kaart"><h3 style="margin-top:0">Lastigste opdrachten</h3>${moeilijk.length ? `<div class="tabelwrap"><table class="docent-tabel"><tr><th>Vraag</th><th>Gem. foute pogingen</th><th>Uitwerking bekeken</th><th>Gemaakt door</th></tr>${moeilijk.map(([id, o]) => `<tr><td><b>${id}</b></td><td>${(o.a / o.n).toFixed(1).replace('.', ',')}</td><td>${o.g}×</td><td>${o.n}</td></tr>`).join('')}</table></div>` : '<p>Nog geen gegevens.</p>'}</div>
  <div class="kaart"><h3 style="margin-top:0">Leerlingen</h3><div class="tabelwrap"><table class="docent-tabel"><tr><th>Naam</th><th>XP</th>${PAR.map(p => `<th>${p.id}</th>`).join('')}<th>1e keer goed</th><th>Hints</th><th>Training</th><th>Laatst actief</th><th></th></tr>
  ${rows.map(r0 => `<tr><td><b>${esc(r0.l.naam)}</b>${r0.l.pinreset ? ' <small style="color:#b06f00">(pin gereset)</small>' : ''}</td><td>${r0.l.xp}</td>
    ${r0.per.map(x => `<td><span class="mini"><small>${x.done}/${x.totaal} ${'★'.repeat(x.sterren)}</small><div class="balk"><div style="width:${100 * x.done / x.totaal}%"></div></div></span></td>`).join('')}
    <td>${r0.pctEerste == null ? '–' : r0.pctEerste + '%'}</td><td>${r0.hints}</td><td>${r0.train}</td><td>${fmtDatum(r0.l.updated_at)}</td>
    <td style="white-space:nowrap"><button class="knop licht klein" data-act="d-pin" data-n="${esc(r0.l.naam)}">Pin reset</button> <button class="knop licht klein" data-act="d-del" data-n="${esc(r0.l.naam)}">🗑</button></td></tr>`).join('')}
  </table></div><p style="font-size:.82rem;color:var(--zacht)">Pin reset: de leerling kiest bij de volgende keer inloggen zelf een nieuwe pincode. Voortgang blijft behouden.</p></div>`;
}
function exporteerCSV() {
  const rows = D.data.map(l => Object.assign({ l }, statsLeerling(l)));
  const kop0 = ['naam', 'xp', ...PAR.map(p => p.id + ' gemaakt'), ...PAR.map(p => p.id + ' sterren'), 'eerste keer goed %', 'hints', 'training goed', 'laatst actief'];
  const lijnen = [kop0.join(';')].concat(rows.map(r0 => [r0.l.naam, r0.l.xp, ...r0.per.map(x => x.done + '/' + x.totaal), ...r0.per.map(x => x.sterren), r0.pctEerste ?? '', r0.hints, r0.train, r0.l.updated_at || ''].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')));
  const blob = new Blob(['﻿' + lijnen.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `rekonomie_${D.klas}.csv`; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- strijd (docent / digibord) ---------- */
function strijdSetup(melding) {
  ui.scherm = 'docent'; stopHost();
  app().innerHTML = docentKop('s') + `<main class="wrap"><div class="kaart"><h2>⚔️ Nieuwe klassikale strijd</h2>${melding ? `<div class="melding fout">${esc(melding)}</div>` : ''}
    <div class="grid2"><div>
      <label class="veld">Klas<input id="sKlas" value="${esc(D.klas || '')}" maxlength="12" placeholder="bijv. 4V2"></label>
      <label class="veld">Aantal vragen<select id="sAantal"><option>5</option><option selected>8</option><option>10</option><option>15</option></select></label>
      <label class="veld">Tijd per vraag<select id="sTijd"><option value="30">30 seconden</option><option value="45">45 seconden</option><option value="60" selected>60 seconden</option><option value="90">90 seconden</option><option value="120">2 minuten</option></select></label>
      <label class="veld">Spelvorm<select id="sMode"><option value="solo">Ieder voor zich</option><option value="teams">Teams (Duin · Bos · Zee · Strand)</option><option value="docent">Klas tegen docent</option></select></label>
    </div><div><b>Stof</b><div class="check-lijst">${PAR.map(p => `<label><input type="checkbox" value="${p.id}" class="sPar" ${p.h === 1 ? 'checked' : ''}> ${p.id} ${esc(p.titel)}</label>`).join('')}</div></div></div>
    <p style="font-size:.88rem;color:var(--zacht)">De vragen zijn varianten met nieuwe getallen, zodat niemand de antwoorden uit het boekje kan overnemen. Leerlingen hebben hun rekenmachine nodig. Snel én goed antwoorden levert de meeste punten op (500–1000 per vraag).</p>
    <button class="knop accent" data-act="s-maak">Spel aanmaken</button></div></main>`;
}
async function maakSpel() {
  const pars = [...document.querySelectorAll('.sPar:checked')].map(x => x.value);
  const klas = $('#sKlas').value.trim().toUpperCase();
  if (!pars.length) return strijdSetup('Kies minstens één paragraaf.');
  const n = +$('#sAantal').value; const qs = [];
  for (let i = 0; i < n; i++) { const pid = pars[i % pars.length]; qs.push(E.toBattle(genereer(pid))); }
  for (let i = qs.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [qs[i], qs[j]] = [qs[j], qs[i]]; }
  try {
    const res = await API.call('rk_game_create', { p_pw: PW, p_klas: klas, p_mode: $('#sMode').value, p_questions: qs, p_duration: +$('#sTijd').value });
    if (!res.ok) return strijdSetup(res.msg);
    D.spel = { code: res.code, laatste: null, docentAntw: null }; startHost();
  } catch (e) { strijdSetup('Aanmaken mislukt: geen verbinding.'); }
}
function startHost() { ui.scherm = 'host'; stopHost(); pollHost(); D.poll = setInterval(pollHost, 1000); }
function stopHost() { if (D.poll) clearInterval(D.poll); D.poll = null; if (D.tik) clearInterval(D.tik); D.tik = null; }
async function pollHost() {
  let s; try { s = await API.call('rk_game_state', { p_code: D.spel.code, p_naam: null }); } catch (e) { return; }
  if (ui.scherm !== 'host') return;
  D.s = s;
  if (s.status === 'question') {
    const rest = s.duration * 1000 - s.elapsed_ms;
    if ((rest <= 0 || (s.players > 0 && s.answered >= s.players && (s.mode !== 'docent' || s.docent_answered))) && !D.bezig) { D.bezig = true; try { await control('reveal'); } finally { D.bezig = false; } return; }
  }
  renderHost(s);
}
async function control(action, waarde, keuze) {
  const res = await API.call('rk_game_control', { p_code: D.spel.code, p_pw: PW, p_action: action, p_waarde: waarde ?? null, p_keuze: keuze ?? null });
  D.spel.laatste = null; await pollHost(); return res;
}
function renderHost(s) {
  const sleutel = s.status + '|' + s.q_index + '|' + s.players + '|' + s.answered + '|' + s.docent_answered;
  if (sleutel === D.spel.laatste) return; D.spel.laatste = sleutel;
  let h = `<div class="bord"><div class="wrap" style="max-width:1200px"><div class="strijd-kop"><div style="display:flex;align-items:center;gap:12px">${LOGO}<b>Rekonomie Arena · ${esc(s.klas)}</b></div>
    <div class="knoprij"><span>Code <b style="color:var(--kl-accent);font-size:1.3rem">${s.code}</b></span><button class="knop licht klein" data-act="h-stop">Stoppen</button></div></div>`;
  const modeNaam = { solo: 'Ieder voor zich', teams: 'Teams', docent: 'Klas tegen docent' }[s.mode];
  if (s.status === 'lobby') {
    h += `<div style="text-align:center;margin-top:20px"><h1>Doe mee!</h1><p style="font-size:1.2rem">Open Rekonomie Arena, log in en kies <b>⚔️ Doe mee met de strijd</b>.</p>
      <div class="spelcode">${s.code}</div><p>${modeNaam} · ${s.total} vragen · ${s.duration} s per vraag</p>
      <p class="groot">${s.players} speler${s.players === 1 ? '' : 's'}</p><div class="spelers" style="justify-content:center">${(s.lijst || []).map(p => `<span class="speler">${p.team ? `<span class="teamlabel team-${p.team}" style="padding:0 6px;margin-right:4px">${TEAMS[p.team].replace('Team ', '')}</span>` : ''}${esc(p.naam)}</span>`).join('')}</div>
      <p style="margin-top:20px"><button class="knop accent" data-act="h-start" ${s.players ? '' : 'disabled'}>▶ Start de strijd</button></p></div>`;
  } else if (s.status === 'question') {
    const q = s.question;
    h += `<div class="timerbalk"><div id="tbalk" style="width:100%"></div></div><div class="strijd-kop"><div class="groot">Vraag ${s.q_index + 1} / ${s.total}</div><div class="timer" id="tijd"></div><div class="groot">${s.answered}/${s.players} beantwoord</div></div>
      ${q.context ? `<div class="bord-context">${q.context}</div>` : ''}<div class="bord-vraag">${q.tekst}</div>
      ${q.type === 'mc' ? `<ol style="font-size:1.4rem">${q.opties.map(o => `<li>${esc(o)}</li>`).join('')}</ol>` : ''}
      ${s.mode === 'docent' ? `<div class="kaart" style="margin-top:18px;max-width:520px">${s.docent_answered ? '<b>Docent heeft geantwoord ✓</b>' : `<b>Antwoord docent</b> (verborgen)<div class="invoerrij" style="margin-top:6px"><input id="hAnt" class="antwoord-invoer" type="password" inputmode="decimal" autocomplete="off" placeholder="••••"><button class="knop" data-act="h-docent">Verstuur</button></div><small>Tip: typ min als - (bijv. -2,9).</small>`}</div>` : ''}
      <p style="margin-top:18px"><button class="knop licht" data-act="h-reveal">Toon antwoord nu</button></p>`;
  } else if (s.status === 'reveal') {
    h += `<div class="strijd-kop"><div class="groot">Vraag ${s.q_index + 1} / ${s.total}</div><div class="groot">${s.pct}% goed</div></div>
      <div class="bord-vraag" style="font-size:1.3rem;opacity:.85">${s.question.tekst}</div>
      <div class="kaart" style="margin-top:14px"><div class="groot" style="color:var(--goed)">Antwoord: ${esc(s.antwoordTekst)}</div>${s.uitleg ? `<p style="font-size:1.1rem">${s.uitleg}</p>` : ''}
      ${s.fout ? `<div class="feedback fout" style="font-size:1.05rem"><b>Meest gegeven foute antwoord:</b> ${esc(typeof s.fout.waarde === 'number' ? fmt(s.fout.waarde, (String(s.fout.waarde).split('.')[1] || '').length) : s.fout.waarde)} (${s.fout.n}×)${s.fout.tekst ? `<br>${esc(s.fout.tekst)}` : ''}</div>` : ''}</div>
      ${stand(s)}
      <p><button class="knop accent" data-act="h-volgende">${s.q_index + 1 >= s.total ? '🏁 Eindstand' : 'Volgende vraag ▶'}</button></p>`;
  } else if (s.status === 'end') {
    h += `<h1 style="text-align:center">🏁 Eindstand</h1>${stand(s, true)}<p style="text-align:center"><button class="knop accent" data-act="d-strijd">Nieuw spel</button> <button class="knop licht" data-act="d-overzicht">Naar overzicht</button></p>`;
    stopHost();
  }
  h += `</div></div>`;
  const hv = $('#hAnt') ? $('#hAnt').value : null;
  app().innerHTML = h;
  if (hv && $('#hAnt')) $('#hAnt').value = hv;
  if (s.status === 'question') {
    if (D.tik) clearInterval(D.tik);
    const eind = Date.now() + s.duration * 1000 - s.elapsed_ms;
    const tik = () => { const rest = Math.max(0, Math.ceil((eind - Date.now()) / 1000)); const t = $('#tijd'); const b = $('#tbalk'); if (t) t.textContent = rest + 's'; if (b) b.style.width = Math.max(0, 100 * (eind - Date.now()) / (s.duration * 1000)) + '%'; };
    tik(); D.tik = setInterval(tik, 500);
  }
}
function stand(s, eind) {
  let h = '';
  if (s.mode === 'docent') h += `<div class="vs" style="margin:16px 0"><div><div>Klas (gemiddeld)</div><div class="sc">${s.klas_gem}</div></div><div><div>Docent</div><div class="sc">${s.docent_score}</div></div></div>${eind ? `<p class="groot" style="text-align:center">${s.klas_gem > s.docent_score ? 'De klas wint! 🎉' : s.klas_gem === s.docent_score ? 'Gelijkspel!' : 'De docent wint! 😎'}</p>` : ''}`;
  if (s.mode === 'teams' && s.teams.length) h += `<div class="kaart"><h3 style="margin-top:0">Teams (gemiddelde score)</h3><ol class="ranglijst">${s.teams.map((t, i) => `<li><span class="pos">${['🥇', '🥈', '🥉'][i] || i + 1}</span><span class="nm"><span class="teamlabel team-${t.team}">${TEAMS[t.team]}</span> <small>${t.n} spelers</small></span><span class="sc">${t.gem}</span></li>`).join('')}</ol></div>`;
  h += `<div class="kaart"><h3 style="margin-top:0">${eind ? 'Top 10' : 'Tussenstand'}</h3><ol class="ranglijst podium">${(s.top || []).slice(0, eind ? 10 : 5).map((p, i) => `<li><span class="pos">${['🥇', '🥈', '🥉'][i] || i + 1}</span><span class="nm">${esc(p.naam)}${p.team ? ` <span class="teamlabel team-${p.team}">${TEAMS[p.team].replace('Team ', '')}</span>` : ''}</span><span class="sc">${p.score}</span></li>`).join('')}</ol></div>`;
  return h;
}

/* ================= ACTIES ================= */
const ACT = {
  'home': () => { sluitModal(); if (S && st) { ui.cur = null; schermHome(); } else schermLogin(); },
  'uitloggen': async () => { await flush(); localStorage.removeItem('rk_sessie'); S = null; st = null; schermLogin(); },
  'open-par': el => { sluitModal(); ui.cur = null; ui.qid = null; openPar(el.dataset.id, 'opdrachten'); },
  'slot': el => { sluitModal(); startCheck(el.dataset.id); },
  'tab': el => { ui.cur = null; ui.tab = el.dataset.tab; if (ui.tab === 'opdrachten') ui.qid = ui.qid || null; openPar(ui.par.id, ui.tab); window.scrollTo(0, 0); },
  'kies-vraag': el => { ui.qid = el.dataset.id; ui.cur = null; renderPar(); const k = $('#vraagkaart'); if (k && k.getBoundingClientRect().top < 0) k.scrollIntoView({ behavior: 'smooth' }); },
  'controleer': () => controleer(),
  'unit': el => { ui.cur.unit = el.dataset.u; const inv = $('#ant'); if (inv) ui.cur.inv = inv.value; herteken(); },
  'teken': () => { const i = $('#ant'); if (!i) return; i.value = i.value.trim().startsWith('-') ? i.value.trim().slice(1) : '-' + i.value.trim(); ui.cur.inv = i.value; },
  'hint': () => { ui.cur.hint = true; st.c.hint++; if (ui.cur.mode === 'boek') { const rec = st.q[ui.cur.q.id] = st.q[ui.cur.q.id] || { a: 0 }; rec.h = true; } bewaar(); herteken(); },
  'toon-uitwerking': () => {
    const c = ui.cur; const q = c.q;
    if (c.mode === 'boek') { const rec = st.q[q.id] = st.q[q.id] || { a: 0 }; Object.assign(rec, { s: 'getoond', f: false, x: 0 }); st.c.streak = 0; bewaar(); herteken(); }
    else { c.klaar = true; const tr = trRec(ui.par.id); tr.st = 0; c.fb = fbHTML('bijna', 'Uitwerking:', `Antwoord: <b>${esc(E.antwoordTekst(q))}</b><div class="uitleg">${q.uitleg || ''}</div>`); bewaar(); renderPar(); }
  },
  'mc': el => {
    const c = ui.cur; const q = c.q; const i = +el.dataset.i; const rec = st.q[q.id] = st.q[q.id] || { a: 0 };
    if (i === q.juist) {
      if (q.schatting) { c.fb = ''; }
      goedAfhandelen(c, rec);
    } else {
      if (q.schatting) { // schatting: geen strafpunten, wel uitleg
        Object.assign(rec, { s: 'goed', f: false, x: 2 }); geefXP(2, 'geschat'); c.fb = ''; bewaar(); herteken();
        return;
      }
      c.fout = (c.fout || []).concat(i); rec.a = (rec.a || 0) + 1; telFout(null);
      c.fb = fbHTML('fout', '✗', 'Dat is niet juist. Probeer het nog eens.'); bewaar(); herteken();
    }
  },
  'toon-model': () => { ui.cur.open = $('#openAnt').value; ui.cur.toonModel = true; herteken(); },
  'zelf': el => { const q = ui.cur.q; const z = el.dataset.z; st.q[q.id] = { s: 'zelf', z, a: 0, f: false, x: 5 }; geefXP(5, 'zelf nagekeken'); st.c.goed++; checkBadges(); bewaar(); herteken(); },
  'train-volgende': () => { ui.cur = null; renderPar(); },
  'check-volgende': () => checkVolgende(),
  'check-theorie': () => modal(`<button class="knop licht klein sluit" data-act="sluit">✕</button><div class="theorie">${ui.par.theorie}</div>`),
  'ranglijst': () => toonRanglijst(),
  'badges': () => toonBadges(),
  'sluit': () => sluitModal(),
  'strijd-join': () => strijdJoinModal(),
  'team': async el => { try { await API.call('rk_game_join', { p_code: G.code, p_naam: S.naam, p_team: +el.dataset.t }); } catch (e) { /* */ } G.laatste = null; startStrijdPoll(); },
  'wissel-team': () => { stopPoll(); kiesTeam(); },
  's-mc': el => strijdVerstuur(null, +el.dataset.i),
  's-verstuur': () => { const v = $('#sAnt').value; const [x, alt] = E.parseNum(v); if (isNaN(x)) { $('#sMelding').innerHTML = '<div class="melding fout">Typ een getal.</div>'; return; } strijdVerstuur(x, null); },
  'teken-s': () => { const i = $('#sAnt'); if (i) i.value = i.value.trim().startsWith('-') ? i.value.trim().slice(1) : '-' + i.value.trim(); },
  'strijd-uit': () => { stopPoll(); schermHome(); },
  'docent-login': () => PW ? docentHome() : docentLogin(),
  'naar-login': () => schermLogin(),
  'd-overzicht': () => { stopHost(); docentHome(); },
  'd-strijd': () => strijdSetup(),
  'd-uit': () => { stopHost(); PW = null; sessionStorage.removeItem('rk_pw'); schermLogin(); },
  'd-ververs': () => laadKlas(),
  'd-csv': () => exporteerCSV(),
  'd-pin': async el => { if (!confirm('Pincode resetten voor ' + el.dataset.n + '?')) return; await API.call('rk_docent_reset_pin', { p_pw: PW, p_klas: D.klas, p_naam: el.dataset.n }); laadKlas(); },
  'd-del': async el => { if (!confirm('Leerling ' + el.dataset.n + ' en alle voortgang verwijderen?')) return; await API.call('rk_docent_verwijder', { p_pw: PW, p_klas: D.klas, p_naam: el.dataset.n }); laadKlas(); },
  's-maak': () => maakSpel(),
  'h-start': () => control('start'),
  'h-reveal': () => control('reveal'),
  'h-volgende': () => control('next'),
  'h-stop': async () => { if (!confirm('Strijd beëindigen?')) return; await control('end'); },
  'h-docent': async () => { const v = $('#hAnt').value; const [x] = E.parseNum(v); if (isNaN(x)) return toast('Typ een getal'); const res = await control('docent', x, null); if (res && res.ok) toast('Antwoord docent ontvangen'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'ant') { e.preventDefault(); controleer(); }
  else if (e.target.id === 'sAnt') { e.preventDefault(); ACT['s-verstuur'](); }
  else if (e.target.id === 'hAnt') { e.preventDefault(); ACT['h-docent'](); }
});
document.addEventListener('input', e => { if (e.target.id === 'ant' && ui.cur) ui.cur.inv = e.target.value; });

/* ================= START ================= */
if (/[?&]docent\b/.test(location.search)) { PW ? docentHome() : docentLogin(); }
else autoLogin();
window.RKAPP = { get st() { return st; }, get S() { return S; }, ui, Mock };
})();

</script>
